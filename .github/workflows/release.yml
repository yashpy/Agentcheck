# Publishes to npm when you push a tag like v0.1.0.
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret needed once the
# package is linked to this repo and workflow on npmjs.com. See PUBLISHING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --access public
